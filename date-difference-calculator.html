<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Date Difference Calculator</title><meta name="description" content="Calculate the number of calendar days and weekdays between two dates."><style>body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:0 20px;line-height:1.6;color:#172033}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #cbd5e1}button{background:#172033;color:white;font-weight:700}.result{background:#ecfeff;border:1px solid #a5f3fc;padding:12px;border-radius:10px;margin-top:12px}a{color:#075985}</style></head><body><p><a href="index.html">← All calculators</a></p><h1>Date Difference Calculator</h1><p>Calculate how many calendar days and weekdays are between two dates. Weekdays exclude Saturday and Sunday.</p><label>Start date<br><input id="a" type="date"></label><br><label>End date<br><input id="b" type="date"></label><br><button onclick="calc()">Calculate difference</button><div id="out" class="result"></div><h2>Useful for</h2><ul><li>Project timeline planning</li><li>Content calendars</li><li>Internal response windows</li><li>Counting days until a milestone</li></ul><script>function isBiz(d){let x=d.getDay();return x!==0&&x!==6}function calc(){if(!a.value||!b.value){out.textContent='Choose both dates.';return}let d1=new Date(a.value+'T00:00:00'),d2=new Date(b.value+'T00:00:00');let start=new Date(Math.min(d1,d2)),end=new Date(Math.max(d1,d2));let cal=Math.round((end-start)/86400000),biz=0;for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){if(isBiz(d))biz++}out.textContent=cal+' calendar days apart; '+biz+' weekdays when counting both selected dates.'}let today=new Date();a.value=today.toISOString().slice(0,10);today.setDate(today.getDate()+30);b.value=today.toISOString().slice(0,10);calc();</script></body></html>
