<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weekday Lookup Tool</title><meta name="description" content="Find what day of the week any date falls on with this free weekday lookup tool."><style>body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.6;color:#172033}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #cbd5e1}button{background:#172033;color:white;font-weight:700}.result{background:#ecfeff;border:1px solid #a5f3fc;padding:12px;border-radius:10px;margin-top:12px}</style></head><body><p><a href="index.html">← All calculators</a></p><h1>Weekday Lookup Tool</h1><p>Enter a date to see what weekday it falls on.</p><input id="date" type="date"> <button onclick="lookup()">Look up weekday</button><div id="out" class="result"></div><h2>Why this is useful</h2><p>Weekday lookup is useful for planning launches, meetings, editorial calendars, project milestones, and reminder schedules.</p><script>function lookup(){if(!date.value){out.textContent='Choose a date.';return}let d=new Date(date.value+'T00:00:00');out.textContent=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}date.value=new Date().toISOString().slice(0,10);lookup();</script></body></html>
